name: tmp-verify
on: [push]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: regenerate docs
        run: |
          node test/gen-catalog.js
          node test/gen-node-index.js

      - name: commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NODE-CATALOG.md nodes.html
          git diff --cached --quiet || (git commit -m "regen NODE-CATALOG + nodes.html" && git push)

      - name: smoke
        run: node test/smoke.js

      - name: scratch checks
        if: always()
        run: node test/_scratch.js
